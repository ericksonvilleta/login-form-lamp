<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Form Lamp | @coding.stella</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-on="false">

<div class="container">
  <div class="lamp-wrapper">
    <svg class="lamp-svg" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
      <!-- Inner bulb glow when turned on -->
      <circle class="inner-glow" cx="150" cy="140" r="45" />

      <!-- Lamp Shade (Trapezoidal Flared Shape matching silhouette) -->
      <path class="lamp-shade" d="M 95 15 L 205 15 L 275 165 Q 280 175 265 175 L 35 175 Q 20 175 25 165 Z" />

      <!-- Neck / Socket Connector -->
      <path class="lamp-base" d="M 135 175 L 165 175 L 165 195 L 135 195 Z" />

      <!-- Ceramic Bulbous Base (Classic Ginger Jar Silhouette) -->
      <path class="lamp-base" d="M 120 195 Q 160 195 180 205 Q 195 215 195 235 Q 235 260 235 315 Q 235 375 185 390 Q 160 395 150 395 Q 140 395 115 390 Q 65 375 65 315 Q 65 260 105 235 Q 105 215 120 195 Z" />

      <!-- Pull Cord (adjusted coordinates to align with the new layout) -->
      <g class="pull-cord">
        <line class="cord-line" x1="190" y1="120" x2="190" y2="200" />
        <circle class="cord-bead" cx="190" cy="210" r="6" />
        <circle class="cord-hit" cx="190" cy="210" r="25" fill="transparent" />
      </g>
    </svg>
  </div>

  <div class="login-form">
    <h2>Welcome</h2>

    <form onsubmit="return false;">
      <div class="form-group">
        <label>Username</label>
        <input type="text" placeholder="Enter name">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Enter Password">
      </div>

      <button class="login-btn">Sign In</button>
    </form>
  </div>
</div>

<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/Draggable.min.js"></script>
<script src="script.js"></script>

</body>
</html>
